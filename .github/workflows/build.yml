name: Build Jellyfin plugins
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - jellyfin: '10.10.7'
            framework: net8.0
            sdk: '8.0.x'
          - jellyfin: '10.11.0'
            framework: net9.0
            sdk: '9.0.x'
          - jellyfin: '12.0.0'
            framework: net10.0
            sdk: '10.0.x'
          - jellyfin: '12.4.0'
            framework: net10.0
            sdk: '10.0.x'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}
      - run: dotnet build -c Release -p:JellyfinVersion=${{ matrix.jellyfin }} -p:PluginTargetFramework=${{ matrix.framework }}
      - uses: actions/upload-artifact@v4
        with:
          name: LibraryRuntime-Jellyfin-${{ matrix.jellyfin }}
          path: bin/Release/${{ matrix.framework }}/LibraryRuntime.dll
          if-no-files-found: error
